<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" role="img" aria-label="A model moving from draft to evaluated to production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2ff"/>
      <stop offset="1" stop-color="#e5dbff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#748ffc"/>
      <stop offset="1" stop-color="#4c6ef5"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#364fc7" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="620" height="380" rx="28" fill="url(#bg)"/>
  <circle cx="545" cy="55" r="70" fill="#ffffff" fill-opacity=".45"/>
  <circle cx="60" cy="330" r="90" fill="#ffffff" fill-opacity=".35"/>

  <!-- pipeline line -->
  <path d="M100 118 H310 H520" stroke="#b197fc" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" fill="none"/>

  <!-- three stage cards -->
  <g filter="url(#sh)">
    <rect x="42" y="64" width="116" height="108" rx="16" fill="#ffffff"/>
    <rect x="252" y="64" width="116" height="108" rx="16" fill="#ffffff"/>
    <rect x="462" y="64" width="116" height="108" rx="16" fill="#ffffff"/>
  </g>

  <!-- draft -->
  <circle cx="100" cy="102" r="14" fill="#dee2e6"/>
  <rect x="62" y="128" width="76" height="8" rx="4" fill="#ced4da"/>
  <rect x="62" y="144" width="52" height="8" rx="4" fill="#e9ecef"/>
  <!-- evaluated -->
  <circle cx="310" cy="102" r="14" fill="#ffd43b"/>
  <path d="M303 102 l5 5 l9 -10" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="272" y="128" width="76" height="8" rx="4" fill="#ffe8a3"/>
  <rect x="272" y="144" width="60" height="8" rx="4" fill="#fff3bf"/>
  <!-- production -->
  <circle cx="520" cy="102" r="14" fill="#38d9a9"/>
  <path d="M514 108 l12 -12 M519 96 h7 v7" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="482" y="128" width="76" height="8" rx="4" fill="#96f2d7"/>
  <rect x="482" y="144" width="64" height="8" rx="4" fill="#c3fae8"/>

  <!-- accuracy chart -->
  <g filter="url(#sh)">
    <rect x="42" y="204" width="536" height="138" rx="18" fill="#ffffff"/>
  </g>
  <text x="66" y="238" font-family="system-ui, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#495057">Accuracy</text>
  <text x="66" y="258" font-family="system-ui, Segoe UI, sans-serif" font-size="12" fill="#868e96">last five runs</text>
  <line x1="66" y1="296" x2="554" y2="296" stroke="#e9ecef" stroke-width="2"/>
  <line x1="66" y1="262" x2="554" y2="262" stroke="#38d9a9" stroke-width="2" stroke-dasharray="6 6" opacity=".7"/>
  <text x="520" y="256" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#12b886">80%</text>
  <rect x="190" y="266" width="44" height="30" rx="7" fill="url(#bar)"/>
  <rect x="250" y="258" width="44" height="38" rx="7" fill="url(#bar)"/>
  <rect x="310" y="250" width="44" height="46" rx="7" fill="url(#bar)"/>
  <rect x="370" y="240" width="44" height="56" rx="7" fill="url(#bar)"/>
  <rect x="430" y="226" width="44" height="70" rx="7" fill="#38d9a9"/>
</svg>
